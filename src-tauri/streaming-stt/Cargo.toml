[package]
name = "streaming-stt"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["net", "macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
