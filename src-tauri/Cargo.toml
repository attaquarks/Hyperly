[package]
name = "hyperly"
version = "0.2.0"
description = "A privacy-first AI assistant overlay with text, screenshot, and voice support."
authors = ["Attaquarks <mail@attaquarks.com>"]
license = "GPL-3.0"
repository = "https://github.com/attaquarks/hyperly"
homepage = "https://github.com/attaquarks/hyperly"
documentation = "https://github.com/attaquarks/hyperly/wiki"
readme = "../README.md"
keywords = ["ai-assistant", "tauri", "desktop-app", "privacy-first", "meeting-assistant"]
categories = ["gui", "multimedia", "accessibility", "science", "development-tools"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hyperly_lib"
# rlib only. The template's `staticlib`/`cdylib` exist for mobile embedding;
# Hyperly is desktop-only and the exe statically links the rlib, so the extra
# crate types just build a `hyperly_lib.dll` nothing ever loads — and on the
# windows-gnu toolchain mingw's linker auto-exports every symbol from a DLL
# (200k+ exports with the full Tauri tree, past the 65,535 ordinal limit),
# which killed `npm run tauri dev` with "export ordinal too large: 232523".
# MSVC only escaped it because it exports an explicit symbol list instead.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
# Test-only WDIO plugins, compiled in exclusively via the `wdio` feature
# (desktop E2E builds). Production builds never enable it.
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tauri-plugin-opener = "2"
tauri-plugin-http = "2.5.2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25.6"
xcap = "0.0.12"
base64 = "0.22"
cpal = "0.15.3"
hound = "3.5.1"
tokio = { version = "1.0", features = ["full"] }
once_cell = "1.19.0"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
# Streaming STT (Tier 2): the WebSocket path for streaming-capable providers
# (Deepgram nova-3 and friends) — audio streams up, words come back live.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
anyhow = "1.0"
tracing = "0.1"
ringbuf = "0.4.8"
tauri-plugin-shell = "2.3.1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }


[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2"
cidre = "0.11.3"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.19.0"
winreg = "0.55.0"
# Windows mic permission: Tauri only brokers it on macOS, so the WebView2
# PermissionRequested handler has to be installed by hand (src/mic_permission.rs).
webview2-com = "0.38.0"
# Non-activating window surfacing for the overlay (win_activation.rs): the
# shortcut toggle must show/restore the overlay WITHOUT SetForegroundWindow.
# Same major version tauri itself resolves (0.61.3 in Cargo.lock), so this
# adds no new crate — only the Win32_UI_WindowsAndMessaging feature gate.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"

[features]
# Desktop E2E testing only: embeds the WebDriver server and WDIO IPC bridge.
# Never enabled for production builds (see .github/workflows/desktop-e2e.yml).
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
